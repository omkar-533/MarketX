services:
  - type: web
    name: marketx-api
    runtime: node
    region: singapore
    # Starter = always-on (no 15-min free-tier sleep / cold start).
    plan: starter
    autoDeploy: true
    
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
    envVars:
      # === Node Environment ===
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      
      # === URLs (single Render deploy: use same URL for all three) ===
      - key: FRONTEND_URL
        sync: false  # https://YOUR-SERVICE.onrender.com
      - key: API_PUBLIC_URL
        sync: false  # https://YOUR-SERVICE.onrender.com
      - key: CORS_ORIGINS
        sync: false  # https://YOUR-SERVICE.onrender.com,http://localhost:5173
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      
      # === Market Data (TradingView unofficial quote socket — no broker OAuth) ===
      - key: MARKET_PROVIDER
        value: tradingview
      - key: MARKET_LIVE
        value: "true"
      
      # === Optional: AI Services ===
      - key: OPENROUTER_API_KEY
        sync: false
      
      # === Logging ===
      - key: LOG_LEVEL
        value: info
