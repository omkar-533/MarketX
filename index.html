<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="description" content="Wolf Trade AI — live NSE options, OI, signals & AI trading workspace" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wolf Trade AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=wtai3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=wtai3" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=wtai3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=wtai3" />
    <link rel="manifest" href="/manifest.webmanifest?v=wtai3" />
    <title>Wolf Trade AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function () {
        var t = localStorage.getItem('tradeflow_theme');
        var mode = t === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.classList.remove('theme-dark', 'theme-light');
        root.classList.add(mode === 'light' ? 'theme-light' : 'theme-dark');
        root.style.colorScheme = mode;
      })();
    </script>
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0e17;color:#94a3b8;font-family:Inter,system-ui,sans-serif;font-size:14px">
        Loading Wolf Trade AI…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
