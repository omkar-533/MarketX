# Vercel's Git integration has gone quiet before, leaving the site on an old bundle
# while the API on Render moved ahead. This fires the deploy hook ourselves on every
# push to main so a merged change always reaches production.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is missing. Create a Deploy Hook in the Vercel project (Settings > Git > Deploy Hooks) and save the URL as a repository secret."
            exit 1
          fi
          status=$(curl -sS -X POST "$HOOK" -o body.json -w '%{http_code}')
          cat body.json || true
          echo
          if [ "$status" -ge 300 ]; then
            echo "::error::Deploy hook responded with HTTP $status"
            exit 1
          fi
          echo "Vercel build queued (HTTP $status)."
